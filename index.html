<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khronos - Planificador de tareas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="barra de navegacion" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand text-white fw-bold" href="#">Khronos</a>
      <div class="navbar-nav me-auto flex-row">
        <a class="nav-link active text-white" href="#" id="pestana de tareas">Tareas</a>
        <a class="nav-link text-secondary" href="#" id="pestana de equipos">Equipos</a>
        <a class="nav-link text-secondary" href="#" id="pestana de usuarios">Usuarios</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <section id="seccion de tareas">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-12">
          
          <div class="card tarjeta formulario">
            <div class="card-body">
              <h4 class="fw-bold text-dark titulo formulario">Nueva tarea</h4>
              
              <form id="formulario de tarea" novalidate>
                <div class="bloque campo">
                  <label for="nombre de tarea" class="form-label etiqueta campo">Nombre</label>
                  <input type="text" id="nombre de tarea" class="form-control">
                </div>
                
                <div class="bloque campo">
                  <label for="descripcion de tarea" class="form-label etiqueta campo">Descripción</label>
                  <textarea id="descripcion de tarea" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="row">
                  <div class="col bloque campo">
                    <label for="usuario asignado" class="form-label etiqueta campo">Asignado a</label>
                    <select id="usuario asignado" class="form-select">
                      <option value="" selected disabled>Selecciona un usuario</option>
                      <option value="User Uno">User Uno</option>
                      <option value="User Dos">User Dos</option>
                      <option value="User Tres">User Tres</option>
                      <option value="User Cuatro">User Cuatro</option>
                      <option value="User Cinco">User Cinco</option>
                    </select>
                  </div>
                  
                  <div class="col bloque campo">
                    <label for="fecha de entrega" class="form-label etiqueta campo">Fecha de entrega</label>
                    <input type="date" id="fecha de entrega" class="form-control">
                  </div>
                </div>
                
                <div class="bloque campo">
                  <label for="estado de tarea" class="form-label etiqueta campo">Estado</label>
                  <select id="estado de tarea" class="form-select">
                    <option value="Pendiente" selected>Pendiente</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Completada">Completada</option>
                  </select>
                </div>
                
                <div class="contenedor botones">
                  <button type="button" id="boton de cancelar" class="btn boton cancelar">Cancelar</button>
                  <button type="submit" id="boton de guardar" class="btn btn-primary boton guardar">Guardar tarea</button>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="localstorage.js"></script>
  <script src="script.js"></script>
</body>
</html>
