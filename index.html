<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khronos - Planificador de tareas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="barra de navegacion" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand text-white fw-bold" href="#">Khronos</a>
      <div class="navbar-nav me-auto flex-row gap-3">
        <a class="nav-link active text-white" href="#" id="pestana de tareas">Tareas</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <section id="seccion de tareas">
      <div class="row g-4">
        <div class="col-lg-5 col-md-6 col-12">
          <div class="card tarjeta formulario">
            <div class="card-body">
              <h4 class="fw-bold text-dark titulo formulario">Nueva tarea</h4>
              
              <form id="formulario de tarea" novalidate>
                <div class="bloque campo">
                  <label for="nombre de tarea" class="form-label etiqueta campo">Nombre de la tarea</label>
                  <input type="text" id="nombre de tarea" name="nombre" class="form-control" placeholder="Mas de 8 caracteres">
                </div>
                
                <div class="bloque campo">
                  <label for="descripcion de tarea" class="form-label etiqueta campo">Descripcion</label>
                  <textarea id="descripcion de tarea" name="descripcion" class="form-control" rows="3" placeholder="Mas de 15 caracteres"></textarea>
                </div>
                
                <div class="row">
                  <div class="col-sm-6 bloque campo">
                    <label for="usuario asignado" class="form-label etiqueta campo">Asignado a</label>
                    <input type="text" id="usuario asignado" name="asignado" class="form-control" placeholder="Mas de 8 caracteres">
                  </div>
                  
                  <div class="col-sm-6 bloque campo">
                    <label for="fecha de entrega" class="form-label etiqueta campo">Fecha de entrega</label>
                    <input type="date" id="fecha de entrega" name="fecha" class="form-control">
                  </div>
                </div>
                
                <div class="bloque campo">
                  <label for="estado de tarea" class="form-label etiqueta campo">Estado</label>
                  <select id="estado de tarea" name="estado" class="form-select">
                    <option value="" selected disabled>Selecciona un estado</option>
                    <option value="POR HACER">POR HACER</option>
                    <option value="EN PROCESO">EN PROCESO</option>
                    <option value="REVISIÓN">REVISIÓN</option>
                    <option value="HECHO">HECHO</option>
                  </select>
                </div>
                
                <div class="contenedor botones">
                  <button type="button" id="boton de cancelar tarea" class="btn boton cancelar">Cancelar</button>
                  <button type="submit" id="boton de guardar tarea" class="btn btn-primary boton guardar">Guardar tarea</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7 col-md-6 col-12">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark m-0">Listado de tareas</h4>
          </div>
          <div id="listado de tareas"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="localstorage.js"></script>
  <script src="logic/validaciones.js"></script>
  <script src="logic/administrador.js"></script>
  <script src="logic/interfaz.js"></script>
  <script src="script.js"></script>
</body>
</html>
